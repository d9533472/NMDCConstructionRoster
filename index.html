<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>施工組班表</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1d2330; --muted:#6b7280; --line:#e3e6eb;
  --we:#f1f3f7; --hol:#fff1f1; --holInk:#c0262d; --accent:#2563eb; --accentInk:#fff;
  --A:#f59e0b; --Aink:#3b2500; --E:#fcd34d; --Eink:#3b2c00;
  --B:#34a853; --Bink:#ffffff; --L:#14b8a6; --Link:#ffffff;
  --N:#3b4a9c; --Nink:#ffffff; --off:#e8eaee; --offInk:#8a909b;
  --ok:#15803d; --okBg:#e8f6ec; --bad:#b91c1c; --badBg:#fdecec; --warnBg:#fff7e0; --warn:#92580b;
  --auto:#7c3aed; --save:#16a34a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --card:#1b1f27; --ink:#e7e9ee; --muted:#9aa1ad; --line:#2c323d;
    --we:#20252e; --hol:#2c1a1c; --holInk:#ff8a8f;
    --off:#262b34; --offInk:#7d8592; --okBg:#173022; --ok:#6ee7a0; --badBg:#3a1a1a; --bad:#ff9a9a; --warnBg:#33290f; --warn:#f5c060;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --card:#1b1f27; --ink:#e7e9ee; --muted:#9aa1ad; --line:#2c323d;
  --we:#20252e; --hol:#2c1a1c; --holInk:#ff8a8f;
  --off:#262b34; --offInk:#7d8592; --okBg:#173022; --ok:#6ee7a0; --badBg:#3a1a1a; --bad:#ff9a9a; --warnBg:#33290f; --warn:#f5c060;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;font-size:14px}
header{padding:16px 16px 6px;max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
h1{font-size:22px;margin:0}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-size:18px;min-width:120px;text-align:center}
.sub{color:var(--muted);font-size:13px}
.status{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--okBg);color:var(--ok)}
.status.dirty{background:var(--warnBg);color:var(--warn);font-weight:700}
.status.empty{background:var(--off);color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.big{font-size:15px;font-weight:700;padding:9px 18px;border:none;color:#fff;border-radius:10px}
.b-auto{background:var(--auto)} .b-save{background:var(--save)}
.toolbar{max-width:1500px;margin:0 auto;padding:6px 16px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .sp{flex:1}
main{max-width:1500px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.card h2{font-size:15px;margin:0 0 10px}
.banner{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.banner.info{background:var(--warnBg);color:var(--warn)}
.banner.err{background:var(--badBg);color:var(--bad)}
.banner:empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;align-items:center}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font-weight:700;font-size:12px}
.s-A{background:var(--A);color:var(--Aink)} .s-E{background:var(--E);color:var(--Eink)}
.s-B{background:var(--B);color:var(--Bink)} .s-L{background:var(--L);color:var(--Link)}
.s-N{background:var(--N);color:var(--Nink)} .s-O{background:var(--off);color:var(--offInk)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.roster{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.roster th,.roster td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:3px;white-space:nowrap}
.roster thead th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;line-height:1.25}
.roster thead th.day{cursor:pointer}
.roster thead th.day:hover{outline:2px solid var(--accent);outline-offset:-2px}
.roster .nm{position:sticky;left:0;background:var(--card);z-index:3;text-align:left;padding:4px 10px;min-width:126px}
.roster td.pname{cursor:pointer}
.roster td.pname:hover{outline:2px solid var(--accent);outline-offset:-2px}
.roster .nm small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.roster td.we,.roster th.we{background:var(--we)}
.roster td.hol,.roster th.hol{background:var(--hol)}
.roster th.hol{color:var(--holInk)}
.roster th .dw{color:var(--muted);font-weight:400}
.roster td.cell{cursor:pointer;width:40px}
.roster td.cell:hover .chip{outline:2px solid var(--accent)}
.roster td.chg .chip{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--warn)}
.roster tr.ref td{font-size:12px;color:var(--muted)}
.roster tr.cov td{font-size:11px;padding:2px}
.okc{color:var(--ok)} .badc{color:var(--bad);font-weight:700}
.roster tr.sep td{border-top:2px solid var(--muted)}
.stats{border-collapse:collapse;width:100%;min-width:820px}
.stats th,.stats td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats thead th{color:var(--muted);font-weight:600;font-size:12px}
.stats td.ot{font-weight:700}
.pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:8px;display:none;grid-template-columns:repeat(3,auto);gap:6px}
.pop button{padding:4px;border:none;background:none}
.pop .chip{min-width:58px;height:30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.dlg{background:var(--card);border-radius:14px;padding:18px;width:min(520px,100%);max-height:85vh;overflow:auto;border:1px solid var(--line)}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.dlg input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.vlist li .meta{flex:1;font-size:13px}
.vlist li .meta small{display:block;color:var(--muted)}
.vlist .cur{font-size:11px;background:var(--okBg);color:var(--ok);padding:2px 6px;border-radius:6px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;display:none;z-index:70}
@page{size:A4 landscape;margin:7mm}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#c9ced6;
    --we:#eef0f4; --hol:#fde8e8; --holInk:#c0262d;
    --off:#e8eaee; --offInk:#8a909b; --ok:#15803d; --okBg:#e8f6ec; --bad:#b91c1c; --badBg:#fdecec; --warnBg:#fff7e0; --warn:#92580b;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,.pop,.noprint,.monthnav button,.status,.banner,.modal,.toast{display:none!important}
  body{background:#fff;font-size:10px}
  header{padding:0 0 3px;max-width:none} h1{font-size:15px} .monthnav b{font-size:14px;min-width:0}
  main{max-width:none;padding:0}
  .card{border:none;padding:0;margin-top:4px;border-radius:0}
  .card h2{font-size:12px;margin:0 0 3px}
  .legend{font-size:9px;gap:3px 8px}
  .legend .chip{height:14px;min-width:26px;font-size:8px}
  .wrap{overflow:visible;border:none;border-radius:0}
  table.roster{width:100%;min-width:0;table-layout:fixed;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .roster th,.roster td{padding:1px 0}
  .roster tr{break-inside:avoid}
  .roster thead th{position:static;font-size:8px;line-height:1.15}
  .roster .nm{position:static;min-width:0;width:23mm;padding:1px 3px;font-size:9px;white-space:normal}
  .roster .nm small{font-size:7px}
  .roster .sub,.stats .sub{font-size:8px}
  .roster td.pname .sub:last-child{display:none}
  .roster td.cell{width:auto}
  .roster .chip{min-width:0;width:100%;height:14px;padding:0;border-radius:2px;font-size:7px;letter-spacing:-.3px}
  .roster td.chg .chip{box-shadow:none}
  .roster tr.cov td{font-size:8px;padding:0}
  .stats{min-width:0;font-size:9px;break-inside:avoid}
  .stats th,.stats td{padding:2px 5px}
  .stats thead th{font-size:8px}
}
</style>
</head>
<body>
<header>
  <h1 data-en="Construction Team Roster">施工組班表</h1>
  <div class="monthnav">
    <button id="prevM" title="上個月" data-en-title="Previous month">‹</button><b id="mLabel"></b><button id="nextM" title="下個月" data-en-title="Next month">›</button>
  </div>
  <span class="status empty" id="status">載入中…</span>
  <span style="flex:1"></span>
  <button id="btnLang" class="noprint" title="切換語言 / Switch language">🌐 English</button>
</header>
<div class="toolbar">
  <button class="big b-auto" id="btnAuto" data-en="⚡ Auto-schedule">⚡ 自動排班</button>
  <button class="big b-save" id="btnSave" disabled data-en="💾 Save">💾 存檔</button>
  <button id="btnDiscard" disabled data-en="↶ Discard changes">↶ 放棄修改</button>
  <button id="btnHist" data-en="🕘 History">🕘 版本紀錄</button>
  <span class="sp"></span>
  <button id="btnCsv" data-en="⬇ Export Excel (CSV)">⬇ 匯出 Excel (CSV)</button>
  <button onclick="window.print()" data-en="🖨 Print">🖨 列印</button>
</div>
<main>
  <div class="banner" id="banner"></div>
  <div class="card">
    <div class="legend" id="legend"></div>
  </div>
  <div class="card">
    <div class="wrap"><table class="roster" id="roster"></table></div>
    <div class="sub noprint" style="margin-top:8px" data-en="Click a person's cell to change the shift; click a date to set or unset a public holiday. Changes are only kept (and visible to others) after you press &quot;💾 Save&quot;. Changed but unsaved cells are outlined in yellow.">點人員的格子可以改班別，點日期可以設定或取消國定假日。改完要按「💾 存檔」才會存起來，其他人才看得到。改過還沒存的格子會用黃框標出來。</div>
  </div>
  <div class="card">
    <h2 data-en="Hours &amp; Overtime per Person">每人工時與加班時數</h2>
    <div class="wrap" style="border:none"><table class="stats" id="stats"></table></div>
  </div>
</main>
<div class="pop" id="pop"></div>

<div class="modal" id="mSave"><div class="dlg">
  <h3 data-en="💾 Save">💾 存檔</h3>
  <div class="sub" id="saveInfo"></div>
  <label data-en="Saved by">存檔人</label><input id="inBy" maxlength="40" placeholder="例如：Paul" data-en-ph="e.g. Paul">
  <label data-en="Note (optional, helps you find it in History later)">備註（選填，方便日後在版本紀錄找到）</label><input id="inNote" maxlength="200" placeholder="例如：Hunter 12/20 請假" data-en-ph="e.g. Hunter on leave 12/20">
  <div class="acts"><button data-close data-en="Cancel">取消</button><button class="big b-save" id="btnDoSave" data-en="Save">存檔</button></div>
</div></div>

<div class="modal" id="mHist"><div class="dlg">
  <h3><span data-en="🕘 Version History">🕘 版本紀錄</span> <span class="sub" id="histMonth"></span></h3>
  <div class="sub" data-en="Every save keeps a version. After loading an old version the page shows &quot;unsaved changes&quot;; check it, then press Save to restore that version (under a new version number).">每次存檔都會留一個版本。載入舊版後，畫面會變成「有未存檔的修改」，確認沒問題再按存檔，就會還原成那一版（新的版本號）。</div>
  <ul class="vlist" id="vlist"><li>載入中…</li></ul>
  <div class="acts"><button data-close data-en="Close">關閉</button></div>
</div></div>
<div class="modal" id="mName"><div class="dlg">
  <h3 data-en="✎ Rename">✎ 修改名字</h3>
  <div class="sub" id="renameInfo"></div>
  <label data-en="Display name">顯示名稱</label><input id="inName" maxlength="20">
  <div class="acts"><button data-close data-en="Cancel">取消</button><button class="big b-save" id="btnDoName" data-en="OK">確定</button></div>
</div></div>
<div class="modal" id="mWarn"><div class="dlg" style="border-top:6px solid var(--bad)">
  <h3 style="color:var(--bad)" data-en="⚠️ ENV roster not ready">⚠️ 環保尚未排班</h3>
  <div id="warnMsg" style="line-height:1.7"></div>
  <div class="acts"><button class="big b-save" data-close data-en="Got it">我知道了</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script id="core">
// ===== 核心規則（不碰 DOM，可單獨測試）=====
// 語言：zh／en，右上角按鈕切換，記在瀏覽器
let LANG='zh'; try{ if(localStorage.getItem('roster-lang')==='en') LANG='en'; }catch(e){}
const T=(zh,en)=>LANG==='en'?en:zh;
const SHIFTS={
  A:{label:'07–19',name:'白班 12h',en:'Day 12h',  hours:12,wdOT:4,cover:['e','m','l']},
  E:{label:'07–17',name:'早到',    en:'Early',    hours:9, wdOT:1,cover:['e','m']},
  B:{label:'08–17',name:'正常班',  en:'Regular',  hours:8, wdOT:0,cover:['m']},
  L:{label:'08–19',name:'晚走',    en:'Late',     hours:10,wdOT:2,cover:['m','l']},
  N:{label:'19–07',name:'晚班 12h',en:'Night 12h',hours:12,wdOT:4,cover:['n']},
  O:{label:'休',   name:'休假',    en:'Day off',  hours:0, wdOT:0,cover:[],labelEn:'Off'}
};
const shLabel=k=>LANG==='en'&&SHIFTS[k].labelEn||SHIFTS[k].label;
const shName=k=>T(SHIFTS[k].name,SHIFTS[k].en);
const NEED={e:1,m:2,l:1,n:1};
const NEED_LBL={e:'07–08',m:'08–17',l:'17–19',n:'19–07'};
// name 只是預設顯示名稱，可在畫面上改；規則一律跟 id 走
const PEOPLE=[
  {id:'hunter', name:'Hunter',  nat:'TW'},
  {id:'becky',  name:'Becky',   nat:'TW'},
  {id:'yoyo',   name:'YOYO',    nat:'TW'},
  {id:'newe',   name:'新工程師', nat:'TW'},
  {id:'mandeep',name:'Mandeep', nat:'FW'},
  {id:'cheng',  name:'老鄭',    nat:'TW'},
  {id:'atson',  name:'Atson',   nat:'FW'}
];
// 新工程師：到職日、第二週起可排 07／19、第三週起可支援晚班
const NE_START='2026-12-01', NE_EARLY_FROM='2026-12-07', NE_NIGHT_FROM='2026-12-14';
// 例外：12/5 新工程師提前上 08–19，讓 Hunter 可以六休一（已確認）
const NE_LATE_OK=['2026-12-05'];
// 固定日期國定假日（農曆節日每年不同，請在畫面上點日期加）
const FIXED_HOL={'01-01':'元旦','02-28':'和平紀念日','04-04':'兒童節','05-01':'勞動節','09-28':'教師節','10-10':'國慶日','10-25':'光復節','12-25':'行憲紀念日'};
// 2026-12 前無資料時，11/30 的連續上班天數
const BASE_PREV_STREAK={'2026-12':{hunter:1,becky:1,yoyo:1}};

const pad=n=>String(n).padStart(2,'0');
function makeCtx(y,m,opt={}){
  const nd=new Date(y,m,0).getDate(), key=`${y}-${pad(m)}`;
  const hol=opt.holidays||Object.keys(FIXED_HOL).filter(k=>+k.slice(0,2)===m&&+k.slice(3)<=nd).map(k=>+k.slice(3));
  let raymondOff=opt.raymondOff;
  if(!raymondOff){ raymondOff=[]; for(let d=1;d<=nd;d++) if(new Date(y,m-1,d).getDay()===0) raymondOff.push(d); }
  return {y,m,nd,key,hol,raymondOff,prevStreak:opt.prevStreak||BASE_PREV_STREAK[key]||{}};
}
const ds=(c,d)=>`${c.y}-${pad(c.m)}-${pad(d)}`;
const dow=(c,d)=>new Date(c.y,c.m-1,d).getDay();
const isHol=(c,d)=>c.hol.includes(d);
const isRest=(c,d)=>{const w=dow(c,d);return w===0||w===6||isHol(c,d);};
const isWeekday=(c,d)=>!isRest(c,d);
const raymondWorks=(c,d)=>!c.raymondOff.includes(d);
const neEmployed=(c,d)=>ds(c,d)>=NE_START;
const neEarlyOK=(c,d)=>ds(c,d)>=NE_EARLY_FROM;
const neLateEx=(c,d)=>NE_LATE_OK.includes(ds(c,d));
PEOPLE.forEach(p=>p.defName=p.name);
const P=id=>PEOPLE.find(p=>p.id===id).name;
const blank=c=>{const S={};PEOPLE.forEach(p=>S[p.id]=Array(c.nd+1).fill('O'));return S;};

function coverage(S,c,d){
  const r={e:0,m:0,l:0,n:0};
  PEOPLE.forEach(p=>SHIFTS[S[p.id][d]].cover.forEach(k=>r[k]++));
  return r;
}
function twCover(S,c,d,k,exceptId){
  return PEOPLE.filter(p=>p.nat==='TW'&&p.id!==exceptId&&SHIFTS[S[p.id][d]].cover.includes(k)).length;
}

function suggest(c){
  const S=blank(c);
  const CLOSE_W1={1:'hunter',2:'hunter',3:'yoyo',4:'hunter',5:'yoyo'};   // 新工程師第一週
  const CLOSE={1:'yoyo',2:'newe',3:'hunter',4:'newe',5:'yoyo'};
  for(let d=1;d<=c.nd;d++){
    const w=dow(c,d), wk=isWeekday(c,d), early=neEarlyOK(c,d), emp=neEmployed(c,d);
    const closer=wk?(early?CLOSE:CLOSE_W1)[w]:null;
    // Hunter：平日 07 到班（輪到收尾 07–19）；週日 07–19；新工程師還不能顧週六時也上週六
    //   國定假日不預排，需要時由補洞加入（會檢查六休一）
    if(wk) S.hunter[d]= closer==='hunter'?'A':'E';
    else if(!isHol(c,d)&&(w===0||(w===6&&!early&&!neLateEx(c,d)))) S.hunter[d]='A';
    // YOYO：平日 08–17，輪到收尾 08–19
    if(wk) S.yoyo[d]= closer==='yoyo'?'L':'B';
    // Becky：環保班表上班日上 08–17
    if(raymondWorks(c,d)) S.becky[d]='B';
    // Mandeep：週三休；週末／國定假日 07–19，平日 08–17
    if(w!==3) S.mandeep[d]= isRest(c,d)?'A':'B';
    // 新工程師：只上白班。第一週平日 08–17；之後一～四（輪到收尾 08–19），週六 08–19
    if(emp){
      if(!early){ if(wk) S.newe[d]='B'; else if(neLateEx(c,d)) S.newe[d]='L'; }
      else if(wk&&w>=1&&w<=4) S.newe[d]= closer==='newe'?'L':'B';
      else if(w===6&&!isHol(c,d)) S.newe[d]='L';
    }
    // 老鄭：晚班週日休；Atson：晚班週三休
    if(w!==0) S.cheng[d]='N';
    if(w!==3) S.atson[d]='N';
  }
  repair(S,c);
  return S;
}

// 自動補洞：哪天人力不足或缺台灣籍，就依優先順序加人
function dayProblems(S,c,d){
  let n=0; const cv=coverage(S,c,d);
  for(const k in NEED) if(cv[k]<NEED[k]) n+=NEED[k]-cv[k];
  for(const k of ['m','l']) if(!twCover(S,c,d,k)) n++;
  if(S.newe[d]!=='O'&&S.newe[d]!=='N'&&!twCover(S,c,d,'m','newe')) n++;
  return n;
}
function repair(S,c){
  const CAND=[['hunter','A'],['newe','L'],['mandeep','A'],['becky','B'],['atson','N'],['cheng','N'],['mandeep','N']];
  for(let d=1;d<=c.nd;d++){
    for(let guard=0;guard<6&&dayProblems(S,c,d)>0;guard++){
      const before=dayProblems(S,c,d); let done=false;
      for(const [id,sh] of CAND){
        const old=S[id][d]; if(old===sh) continue;
        if(old!=='O'&&!(id==='hunter'&&old==='E')&&!(id==='newe'&&old==='B')) continue;
        const p=PEOPLE.find(x=>x.id===id);
        const pbOld=personIssues(S,c,p).filter(i=>i.lv==='bad').length;
        S[id][d]=sh;
        const pb=personIssues(S,c,p).filter(i=>i.lv==='bad').length;
        if(dayProblems(S,c,d)<before&&pb<=pbOld){done=true;break;}
        S[id][d]=old;
      }
      if(!done) break;
    }
  }
}

function personStats(S,c,p){
  let work=0,off=0,normal=0,otWd=0,otRest=0,run=c.prevStreak[p.id]||0,maxRun=run;
  for(let d=1;d<=c.nd;d++){
    const code=S[p.id][d], s=SHIFTS[code];
    if(code==='O'){off++;run=0;continue;}
    work++; run++; maxRun=Math.max(maxRun,run);
    // 外籍合約每天都上班：每天都是 8 小時正常工時，超過才算加班（不分平日假日）
    if(isRest(c,d)&&p.nat!=='FW') otRest+=s.hours; else {normal+=s.hours-s.wdOT; otWd+=s.wdOT;}
  }
  return {work,off,normal,otWd,otRest,ot:otWd+otRest,total:normal+otWd+otRest,maxRun};
}

function personIssues(S,c,p){
  const out=[], a=S[p.id]; let run=c.prevStreak[p.id]||0;
  const bad=(m,d)=>out.push({lv:'bad',m,d,id:p.id}), warn=(m,d)=>out.push({lv:'warn',m,d,id:p.id});
  const D=d=>`${c.m}/${d}`;
  for(let d=1;d<=c.nd;d++){
    const s=a[d];
    if(s==='O') run=0; else run++;
    if(p.nat==='TW'&&run===7) bad(T(`${p.name} 連續上班到第 7 天（${D(d)}）`,`${p.name}: 7th working day in a row (${D(d)})`),d);
    if(d>1&&a[d-1]==='N'&&s!=='O'&&s!=='N') bad(T(`${p.name} ${D(d-1)} 晚班下班後 ${D(d)} 接著上白班`,`${p.name}: day shift on ${D(d)} right after night shift on ${D(d-1)}`),d);
    if(p.id==='hunter'){
      if(s==='N') bad(T(`${p.name} 只能排白班（${D(d)}）`,`${p.name}: day shifts only (${D(d)})`),d);
      if(isWeekday(c,d)&&s==='O') bad(T(`${p.name} 平日 ${D(d)} 未排班`,`${p.name}: not scheduled on weekday ${D(d)}`),d);
    }
    if(p.id==='yoyo'){
      if(isRest(c,d)&&s!=='O') bad(T(`${p.name} 假日不上班（${D(d)}）`,`${p.name}: does not work weekends/holidays (${D(d)})`),d);
      if(isWeekday(c,d)&&s==='O') bad(T(`${p.name} 平日 ${D(d)} 未排班`,`${p.name}: not scheduled on weekday ${D(d)}`),d);
      if(s==='N'||s==='A'||s==='E') bad(T(`${p.name} 只上 08 起、最晚到 19（${D(d)}）`,`${p.name}: shifts must start at 08 and end by 19 (${D(d)})`),d);
    }
    if(p.id==='becky'){
      if(raymondWorks(c,d)&&s!=='B') bad(T(`${p.name} ${D(d)} 應上 08–17`,`${p.name}: should work 08–17 on ${D(d)}`),d);
      if(!raymondWorks(c,d)&&s!=='O') warn(T(`${p.name} ${D(d)} 這天應休假`,`${p.name}: should be off on ${D(d)}`),d);
    }
    if(p.id==='newe'){
      const ef=NE_EARLY_FROM.slice(5).replace('-','/');
      if(!neEmployed(c,d)&&s!=='O') bad(T(`${p.name} ${D(d)} 還沒到職`,`${p.name}: not yet started on ${D(d)}`),d);
      else if(!neEarlyOK(c,d)&&s!=='O'&&s!=='B'&&!(s==='L'&&neLateEx(c,d))) bad(T(`${p.name} ${ef} 前只排 08–17（${D(d)}）`,`${p.name}: only 08–17 before ${ef} (${D(d)})`),d);
      if(s==='N'&&ds(c,d)<NE_NIGHT_FROM) bad(T(`${p.name} ${D(d)} 還不能上晚班`,`${p.name}: cannot work night shift yet (${D(d)})`),d);
      if(s==='N') warn(T(`${p.name} ${D(d)} 排晚班（目前建議只上白班）`,`${p.name}: night shift on ${D(d)} (day shifts only recommended for now)`),d);
      if(s!=='O'&&s!=='N'&&!twCover(S,c,d,'m','newe')) bad(T(`${p.name} ${D(d)} 白天沒有其他台灣籍同事`,`${p.name}: no other Taiwanese colleague on day shift (${D(d)})`),d);
    }
    if((p.id==='cheng'||p.id==='atson')&&s!=='O'&&s!=='N') bad(T(`${p.name} 只排晚班（${D(d)}）`,`${p.name}: night shifts only (${D(d)})`),d);
    if(p.id==='mandeep'&&s==='N') warn(T(`${p.name} ${D(d)} 排晚班（非必要時盡量避免）`,`${p.name}: night shift on ${D(d)} (avoid unless necessary)`),d);
  }
  return out;
}

function checkIssues(S,c){
  const out=[];
  for(let d=1;d<=c.nd;d++){
    const cv=coverage(S,c,d);
    for(const k in NEED) if(cv[k]<NEED[k]) out.push({lv:'bad',m:T(`${c.m}/${d} ${NEED_LBL[k]} 人力不足（${cv[k]}/${NEED[k]}）`,`${c.m}/${d} ${NEED_LBL[k]} understaffed (${cv[k]}/${NEED[k]})`),d});
    for(const k of ['m','l']) if(cv[k]&&!twCover(S,c,d,k)) out.push({lv:'bad',m:T(`${c.m}/${d} ${NEED_LBL[k]} 沒有台灣籍人員`,`${c.m}/${d} ${NEED_LBL[k]} no Taiwanese staff`),d});
  }
  PEOPLE.forEach(p=>out.push(...personIssues(S,c,p)));
  return out;
}
if(typeof module!=='undefined') module.exports={PEOPLE,SHIFTS,makeCtx,suggest,coverage,personStats,checkIssues,blank};
</script>

<script>
// ===== 畫面與雲端存檔 =====
const API='https://script.google.com/macros/s/AKfycbzG6P2W0s-19ANsSYKtUXxNYsUjoI_ZR-If6oxmzEF3EEefTKO4rA8OLrYf4J31DYGngA/exec';
const ENV_API='https://script.google.com/macros/s/AKfycbyT6kFs6nCt6YCHyQjdbMxgErkOHNxwcIuncju0UkzBq4TvGOIigINusItj9bvcUbRrcw/exec';
const WD='日一二三四五六', WD_EN=['Su','Mo','Tu','We','Th','Fr','Sa'];
const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const wdName=w=>T(WD[w],WD_EN[w]);
const ymLabel=(y,m)=>T(`${y} 年 ${m} 月`,`${MON_EN[m-1]} ${y}`);
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};

let cur={y:2026,m:12};
{ const now=new Date(), q=new URLSearchParams(location.search).get('m');
  if(q&&/^\d{4}-\d{2}$/.test(q)) cur={y:+q.slice(0,4),m:+q.slice(5)};
  else { const ny=now.getFullYear(), nm=now.getMonth()+1;
    // 預設顯示下個月（排班通常是排下個月），但不早於 2026-12
    let y=nm===12?ny+1:ny, m=nm===12?1:nm+1; if(y*100+m<202612){y=2026;m=12;} cur={y,m}; } }

let ctx, S, saved=null, meta={version:0,savedAt:'',savedBy:''}, envCache=null, raymondSrc='';

const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let savedNames={};
const curNames=()=>Object.fromEntries(PEOPLE.map(p=>[p.id,p.name]));
function applyNames(n){PEOPLE.forEach(p=>p.name=(n&&n[p.id])||p.defName);}
const namesDirty=()=>PEOPLE.some(p=>p.name!==(savedNames[p.id]||p.defName));
const sameArr=(a,b)=>JSON.stringify([...a].sort((x,y)=>x-y))===JSON.stringify([...b].sort((x,y)=>x-y));
function isDirty(){
  if(namesDirty()) return true;
  if(!saved) return PEOPLE.some(p=>S[p.id].some(v=>v!=='O'))||!sameArr(ctx.hol,ctx.defaultHol);
  return JSON.stringify(S)!==JSON.stringify(saved.cells)||!sameArr(ctx.hol,saved.holidays||[]);
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600);}
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
const fmtT=s=>{if(!s)return'';const d=new Date(s);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};

async function raymondFor(y,m){
  try{
    if(!envCache) envCache=await getJSON(ENV_API);
    const sd=(envCache.scheduleData||{})[`${y}-${pad(m)}`];
    const r=sd&&sd.cells&&sd.cells.Raymond;
    if(r&&Object.keys(r).length){
      const nd=new Date(y,m,0).getDate(), off=[];
      for(let d=1;d<=nd;d++){const v=r[d]||r[String(d)];if(!v||v==='H')off.push(d);}
      return {off,src:'env'};
    }
    return {off:null,src:'none'};
  }catch(e){return {off:null,src:'fail'};}
}
function endStreaks(cells,c){
  const out={}; PEOPLE.forEach(p=>{let r=0;const a=cells[p.id]||[];for(let d=c.nd;d>=1&&a[d]&&a[d]!=='O';d--)r++;out[p.id]=r;}); return out;
}

async function loadMonth(){
  $('mLabel').textContent=ymLabel(cur.y,cur.m);
  $('status').className='status empty'; $('status').textContent=T('載入中…','Loading…');
  history.replaceState(null,'',`?m=${cur.y}-${pad(cur.m)}`);
  const key=`${cur.y}-${pad(cur.m)}`;
  const pm=cur.m===1?{y:cur.y-1,m:12}:{y:cur.y,m:cur.m-1};
  const [ray,res,prev]=await Promise.all([
    raymondFor(cur.y,cur.m),
    getJSON(`${API}?action=get&month=${key}`).catch(e=>({ok:false,error:String(e)})),
    getJSON(`${API}?action=get&month=${pm.y}-${pad(pm.m)}`).catch(()=>null)
  ]);
  const notes=[];
  if(!res.ok) notes.push({cls:'err',zh:'⚠️ 雲端讀取失敗：'+esc(res.error||'')+'。畫面可以先排，但存不了檔，請稍後重新整理。',en:'⚠️ Could not load from the cloud: '+esc(res.error||'')+'. You can still edit, but saving will not work. Please refresh later.'});
  const data=res.ok&&res.found?res.data:null;
  if(res.ok&&res.names&&!namesDirty()){ savedNames=res.names; applyNames(savedNames); }
  let prevStreak=BASE_PREV_STREAK[key]||{};
  if(prev&&prev.ok&&prev.found){ const pc=makeCtx(pm.y,pm.m); prevStreak=endStreaks(prev.data.cells,pc); }
  raymondSrc=ray.src;
  const raymondOff=ray.off||(data&&data.raymondOff)||null;
  if(ray.src!=='env') notes.push({cls:'info',zh:'📌 環保尚未排班：ENV E-System 還沒有這個月的環保班表，部分班別先用預設排法。等環保組排好之後重新整理，再確認一次班表。',en:'📌 ENV roster not ready: ENV E-System has no environmental roster for this month yet, so some shifts use the default pattern. Refresh after the ENV team has scheduled, then check the roster again.'});
  if(ray.src!=='env') showEnvWarn(ray.src);
  ctx=makeCtx(cur.y,cur.m,{raymondOff:raymondOff||undefined,prevStreak,holidays:data?data.holidays:undefined});
  ctx.defaultHol=makeCtx(cur.y,cur.m).hol;
  if(data){ saved=clone(data); S=clone(data.cells); meta={version:res.version,savedAt:res.savedAt,savedBy:res.savedBy}; }
  else { saved=null; S=blank(ctx); meta={version:0,savedAt:'',savedBy:''};
    if(res.ok) notes.push({cls:'info',zh:'🗓 這個月還沒排班。請按上方紫色的「⚡ 自動排班」先產生建議班表，再自己調整，最後按「💾 存檔」。',en:'🗓 This month has not been scheduled yet. Press the purple "⚡ Auto-schedule" button to generate a suggested roster, adjust it, then press "💾 Save".'}); }
  bannerNotes=notes;
  render();
}
let bannerNotes=[], envWarnSrc=null;
function renderBanner(){
  $('banner').className='banner '+(bannerNotes.some(n=>n.cls==='err')?'err':'info');
  $('banner').innerHTML=bannerNotes.map(n=>T(n.zh,n.en)).join('<br>');
}

function showEnvWarn(src){
  envWarnSrc=src; renderEnvWarn();
  $('mWarn').classList.add('on');
}
function renderEnvWarn(){
  if(!envWarnSrc) return;
  const ym=ymLabel(cur.y,cur.m);
  $('warnMsg').innerHTML=envWarnSrc==='fail'
    ? T(`目前連不上 ENV E-System，讀不到 <b>${ym}</b> 的環保班表。`,`Cannot connect to ENV E-System, so the environmental roster for <b>${ym}</b> could not be read.`)
    : T(`ENV E-System 裡還沒有 <b>${ym}</b> 的環保班表。`,`ENV E-System has no environmental roster for <b>${ym}</b> yet.`);
  $('warnMsg').innerHTML+=T('<br><br>部分班別會先用預設排法。請先跟環保組確認，等 ENV 排好之後重新整理網頁，再確認一次班表。',
    '<br><br>Some shifts will use the default pattern for now. Please check with the ENV team; once ENV is scheduled, refresh this page and review the roster again.');
}
const chip=c=>`<span class="chip s-${c}">${shLabel(c)}</span>`;
function renderLegend(){
  $('legend').innerHTML=Object.keys(SHIFTS).map(k=>`${chip(k)} <span>${shName(k)}</span>`).join('')
    +`<span class="chip" style="background:var(--we);color:var(--muted)">${T('六日','Sat/Sun')}</span><span class="chip" style="background:var(--hol);color:var(--holInk)">${T('國定','Holiday')}</span>`;
}

function render(){
  const c=ctx, dirty=isDirty();
  renderBanner();
  $('mLabel').textContent=ymLabel(c.y,c.m);
  const st=$('status');
  if(dirty){st.className='status dirty';st.textContent=T('● 有未存檔的修改','● Unsaved changes');}
  else if(meta.version){st.className='status';st.textContent=`✓ ${T('已存檔','Saved')} v${meta.version}・${fmtT(meta.savedAt)}${meta.savedBy?'・'+meta.savedBy:''}`;}
  else {st.className='status empty';st.textContent=T('本月尚未排班','Not scheduled yet');}
  $('btnSave').disabled=!dirty; $('btnDiscard').disabled=!dirty;

  const cls=d=>isHol(c,d)?'hol':(isRest(c,d)?'we':'');
  const fh=d=>FIXED_HOL[`${pad(c.m)}-${pad(d)}`];
  let h=`<thead><tr><th class="nm">${T('人員','Staff')}</th>`;
  for(let d=1;d<=c.nd;d++) h+=`<th class="day ${cls(d)}" data-hd="${d}" title="${T('點一下切換國定假日','Click to toggle public holiday')}">${d}<br><span class="dw">${wdName(dow(c,d))}</span>${isHol(c,d)?'<br>'+T((fh(d)||'國定').slice(0,2),'Hol'):''}</th>`;
  h+='</tr></thead><tbody>';
  PEOPLE.forEach((p,pi)=>{
    h+=`<tr${pi===0?' class="sep"':''}><td class="nm pname" data-pid="${p.id}" title="${T('點一下改名字','Click to rename')}"><b>${esc(p.name)}</b> <span class="sub">${p.nat==='TW'?T('台','TW'):T('外','FW')}</span> <span class="sub">✎</span></td>`;
    for(let d=1;d<=c.nd;d++){
      const chg=saved&&saved.cells[p.id]&&saved.cells[p.id][d]!==S[p.id][d];
      h+=`<td class="cell ${cls(d)} ${chg?'chg':''}" data-p="${p.id}" data-d="${d}">${chip(S[p.id][d])}</td>`;
    }
    h+='</tr>';
  });
  Object.keys(NEED).forEach((k,i)=>{
    h+=`<tr class="cov${i===0?' sep':''}"><td class="nm">${NEED_LBL[k]} ${T('人數','staff')}<small>${T('需求','Need')} ≥${NEED[k]}</small></td>`;
    for(let d=1;d<=c.nd;d++){const v=coverage(S,c,d)[k];h+=`<td class="${cls(d)} ${v<NEED[k]?'badc':'okc'}">${v}</td>`;}
    h+='</tr>';
  });
  $('roster').innerHTML=h+'</tbody>';

  const heads=T(['姓名','上班天數','休假天數','正常工時','超過 8 小時加班','休息日/國定加班','加班合計','總工時','上月底連續','最長連續上班'],
    ['Name','Work days','Days off','Regular hrs','OT over 8 h','Rest day/Holiday OT','Total OT','Total hrs','Streak from last month','Longest streak']);
  const dd=n=>T(`${n} 天`,`${n} d`);
  let t='<thead><tr>'+heads.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
  PEOPLE.forEach(p=>{const s=personStats(S,c,p);
    t+=`<tr><td><b>${esc(p.name)}</b> <span class="sub">${p.nat==='TW'?T('台灣籍','Taiwanese'):T('外籍','Foreign')}</span></td><td>${s.work}</td><td>${s.off}</td><td>${s.normal}</td><td>${s.otWd}</td><td>${s.otRest}</td><td class="ot">${s.ot}</td><td>${s.total}</td><td>${dd(c.prevStreak[p.id]||0)}</td><td class="${p.nat==='TW'&&s.maxRun>=7?'badc':''}">${dd(s.maxRun)}</td></tr>`;});
  $('stats').innerHTML=t+'</tbody>';
}

// --- 改班 ---
const pop=$('pop'); let target=null;
const renderPop=()=>pop.innerHTML=Object.keys(SHIFTS).map(k=>`<button data-s="${k}">${chip(k)}</button>`).join('');
$('roster').addEventListener('click',e=>{
  const hd=e.target.closest('th[data-hd]');
  if(hd){const d=+hd.dataset.hd;ctx.hol=ctx.hol.includes(d)?ctx.hol.filter(x=>x!==d):[...ctx.hol,d];render();return;}
  const pn=e.target.closest('td.pname');
  if(pn){ renameId=pn.dataset.pid; const p=PEOPLE.find(x=>x.id===renameId);
    $('inName').value=p.name; $('renameInfo').textContent=T(`預設名稱：${p.defName}。改名只影響顯示，排班規則不變。`,`Default name: ${p.defName}. Renaming only changes the display; scheduling rules stay the same.`);
    $('mName').classList.add('on'); $('inName').focus(); $('inName').select(); return; }
  const td=e.target.closest('td.cell'); if(!td) return;
  target=td; const r=td.getBoundingClientRect();
  pop.style.display='grid';
  pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-220))+'px';
  pop.style.top=(r.bottom+4+130>window.innerHeight? r.top-130 : r.bottom+4)+'px';
  e.stopPropagation();
});
pop.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!target) return;
  S[target.dataset.p][+target.dataset.d]=b.dataset.s; pop.style.display='none'; render();
});
document.addEventListener('click',()=>pop.style.display='none');

let renameId=null;
$('btnDoName').onclick=()=>{
  const v=$('inName').value.trim(); if(!v){$('inName').focus();return;}
  PEOPLE.find(x=>x.id===renameId).name=v.slice(0,20); $('mName').classList.remove('on'); render();
  toast(T('已改名，記得按「💾 存檔」','Renamed. Remember to press "💾 Save"'));
};
$('inName').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnDoName').click();});
// --- 按鈕 ---
$('btnAuto').onclick=()=>{
  const has=PEOPLE.some(p=>S[p.id].some(v=>v!=='O'));
  if(has&&!confirm(T('自動排班會把畫面上這個月的班全部換成系統建議版本。\n（還沒按存檔前，雲端上的舊班表不會被改到）\n\n確定要自動排班嗎？',
    'Auto-schedule will replace every shift on screen for this month with the suggested roster.\n(The saved roster in the cloud is not changed until you press Save.)\n\nAuto-schedule now?'))) return;
  if(raymondSrc!=='env'&&!confirm(T('⚠️ 環保尚未排班：ENV E-System 還沒有這個月的環保班表，部分班別會先用預設排法。\n\n還是要先自動排班嗎？',
    '⚠️ ENV roster not ready: ENV E-System has no environmental roster for this month yet, so some shifts will use the default pattern.\n\nAuto-schedule anyway?'))) return;
  S=suggest(ctx); render(); toast(T('⚡ 已產生建議班表，確認沒問題後記得按「💾 存檔」','⚡ Suggested roster created. Check it, then press "💾 Save"'));
};
$('btnDiscard').onclick=()=>{
  if(!confirm(T('放棄所有未存檔的修改，回到上次存檔的版本？','Discard all unsaved changes and go back to the last saved version?'))) return;
  applyNames(savedNames);
  if(saved){S=clone(saved.cells);ctx.hol=[...(saved.holidays||[])];} else {S=blank(ctx);ctx.hol=[...ctx.defaultHol];}
  render();
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
$('btnSave').onclick=()=>{
  $('inBy').value=ls.get('roster-saved-by')||''; $('inNote').value='';
  $('saveInfo').textContent=T(`${ctx.y} 年 ${ctx.m} 月・存檔後是 v${meta.version+1}。舊版本會留在「版本紀錄」，之後隨時可以載回來。`,
    `${ymLabel(ctx.y,ctx.m)} · this will be saved as v${meta.version+1}. Older versions stay in History and can be loaded back any time.`);
  $('mSave').classList.add('on'); $('inBy').focus();
};
$('btnDoSave').onclick=()=>doSave(false);
async function doSave(force){
  const by=$('inBy').value.trim(); if(!by){$('inBy').focus();toast(T('請填存檔人','Please enter your name'));return;}
  ls.set('roster-saved-by',by);
  const btn=$('btnDoSave'), btnLbl=T('存檔','Save'); btn.disabled=true; btn.textContent=T('存檔中…','Saving…');
  const data={cells:S,holidays:[...ctx.hol].sort((a,b)=>a-b),raymondOff:ctx.raymondOff};
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'save',month:ctx.key,data,names:curNames(),baseVersion:meta.version,force,savedBy:by,note:$('inNote').value.trim(),grid:gridRows('zh')})}).then(x=>x.json());
    if(r.conflict){
      btn.disabled=false; btn.textContent=btnLbl;
      if(confirm(T(`${r.savedBy||'有人'} 在 ${fmtT(r.savedAt)} 已經存了 v${r.version}，比你打開時的版本新。\n\n按「確定」：用你的班表覆蓋（對方那版仍會留在版本紀錄）\n按「取消」：先不存，可以去版本紀錄看對方改了什麼`,
        `${r.savedBy||'Someone'} saved v${r.version} at ${fmtT(r.savedAt)}, which is newer than the version you opened.\n\nOK: overwrite with your roster (their version stays in History)\nCancel: don't save yet, so you can check their changes in History`))) return doSave(true);
      return;
    }
    if(!r.ok) throw new Error(r.error||T('存檔失敗','Save failed'));
    saved=clone(data); savedNames=curNames(); meta={version:r.version,savedAt:r.savedAt,savedBy:r.savedBy};
    $('mSave').classList.remove('on'); render(); toast(`✓ ${T('已存檔','Saved')} v${r.version}`);
  }catch(e){ toast(T('⚠️ 存檔失敗：','⚠️ Save failed: ')+e.message); }
  btn.disabled=false; btn.textContent=btnLbl;
}
$('btnHist').onclick=async()=>{
  $('histMonth').textContent=ymLabel(ctx.y,ctx.m); $('mHist').classList.add('on');
  const ul=$('vlist'); ul.innerHTML=`<li>${T('載入中…','Loading…')}</li>`;
  try{
    const r=await getJSON(`${API}?action=history&month=${ctx.key}`);
    if(!r.list.length){ul.innerHTML=`<li class="sub">${T('這個月還沒有存過任何版本。','No versions saved for this month yet.')}</li>`;return;}
    ul.innerHTML=r.list.map(v=>`<li><div class="meta"><b>v${v.version}</b>${v.version===meta.version?`<span class="cur">${T('目前','Current')}</span>`:''} ・ ${fmtT(v.savedAt)} ・ ${esc(v.savedBy||'')}<small>${esc(v.note||'')}</small></div><button data-v="${v.version}">${T('載入','Load')}</button></li>`).join('');
  }catch(e){ul.innerHTML=`<li class="sub">${T('讀取失敗：','Failed to load: ')}${esc(e.message)}</li>`;}
};
$('vlist').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  if(isDirty()&&!confirm(T('畫面上有未存檔的修改，載入舊版會蓋掉它們。確定？','You have unsaved changes; loading an old version will replace them. Continue?'))) return;
  try{
    const r=await getJSON(`${API}?action=version&month=${ctx.key}&version=${b.dataset.v}`);
    S=clone(r.data.cells); ctx.hol=[...(r.data.holidays||[])];
    $('mHist').classList.remove('on'); render();
    toast(+b.dataset.v===meta.version?T('已載入目前版本','Loaded the current version'):T(`已載入 v${b.dataset.v}，按「💾 存檔」即可還原成這一版`,`Loaded v${b.dataset.v}. Press "💾 Save" to restore this version`));
  }catch(e){toast(T('載入失敗：','Load failed: ')+e.message);}
});
// 存到雲端試算表的固定用中文；匯出 CSV 跟著目前語言
function gridRows(lang=LANG){
  const t=(z,e)=>lang==='en'?e:z, c=ctx;
  const rows=[[t('姓名','Name'),...Array.from({length:c.nd},(_,i)=>`${c.m}/${i+1}(${t(WD,WD_EN)[dow(c,i+1)]})${isHol(c,i+1)?t('國定',' Hol'):''}`),t('上班天數','Work days'),t('正常工時','Regular hrs'),t('加班合計','Total OT'),t('總工時','Total hrs')]];
  PEOPLE.forEach(p=>{const s=personStats(S,c,p);rows.push([p.name,...Array.from({length:c.nd},(_,i)=>{const k=S[p.id][i+1];return lang==='en'&&SHIFTS[k].labelEn||SHIFTS[k].label;}),s.work,s.normal,s.ot,s.total]);});
  return rows;
}
$('btnCsv').onclick=()=>{
  const csv='﻿'+gridRows().map(r=>r.map(v=>`"${v}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${T('施工組班表','ConstructionRoster')}_${ctx.key}.csv`;a.click();
};
function go(delta){
  if(isDirty()&&!confirm(T('這個月有未存檔的修改，切換月份會放棄這些修改。確定？','This month has unsaved changes; switching months will discard them. Continue?'))) return;
  let m=cur.m+delta,y=cur.y; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  cur={y,m}; loadMonth();
}
$('prevM').onclick=()=>go(-1); $('nextM').onclick=()=>go(1);
window.addEventListener('beforeunload',e=>{if(ctx&&isDirty()){e.preventDefault();e.returnValue='';}});
// --- 語言切換 ---
document.querySelectorAll('[data-en]').forEach(e=>e.dataset.zh=e.innerHTML);
document.querySelectorAll('[data-en-ph]').forEach(e=>e.dataset.zhPh=e.placeholder);
document.querySelectorAll('[data-en-title]').forEach(e=>e.dataset.zhTitle=e.title);
function applyLang(){
  document.documentElement.lang=T('zh-Hant','en');
  document.title=T('施工組班表','Construction Team Roster');
  document.querySelectorAll('[data-en]').forEach(e=>e.innerHTML=T(e.dataset.zh,e.dataset.en));
  document.querySelectorAll('[data-en-ph]').forEach(e=>e.placeholder=T(e.dataset.zhPh,e.dataset.enPh));
  document.querySelectorAll('[data-en-title]').forEach(e=>e.title=T(e.dataset.zhTitle,e.dataset.enTitle));
  $('btnLang').textContent=T('🌐 English','🌐 中文');
  renderLegend(); renderPop(); renderEnvWarn();
  if(ctx) render();
}
$('btnLang').onclick=()=>{
  LANG=LANG==='en'?'zh':'en'; ls.set('roster-lang',LANG);
  pop.style.display='none'; applyLang();
};
applyLang();
loadMonth();
</script>
</body>
